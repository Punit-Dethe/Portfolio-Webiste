nks/7378-44c8f5f662def46f.js?dpl=dpl_4EX3owYxmx3buyZVXAYaKyQFXwHR\",\"6676\",\"static/chunks/app/(frontend)/page-6b1cfc1840f61cb0.js?dpl=dpl_4EX3owYxmx3buyZVXAYaKyQFXwHR\"],\"HomeScreen\"]\n18:T564,"])</script><script>self.__next_f.push([1,"If there’s one constant in my life, it’s that I embrace randomness. I collect dice—hundreds of them, scattered across my home, tucked into my pockets, sitting on my desk. Some are polished, some are chipped, some are odd and misshapen. I’ve always been drawn to things that feel just a little bit off.\n\nI roll them to make decisions. Small ones, like what to order at a restaurant. Sometimes big ones, like whether to take a meeting or explore an idea. It’s not about fate—it’s about reminding myself that the universe is weird, and sometimes the best decisions are the ones you don’t see coming.\n\nMy career has followed the same philosophy.\n\nI made my first angel investment in SpaceX when most people thought private space travel was absurd. I backed Uber, DeepMind, Flexport, Affirm, Niantic, and Postmates before they were obvious bets—not because I had some magic foresight, but because I saw founders who were building something so strange, so bold, that the world hadn’t caught up to them yet.\n\nI co-founded Zivity, an art-tech social network, before creator-driven platforms existed. Later, I became the first female partner at Founders Fund, proving that venture capital didn’t have to be an exclusive club. Now, I run Long Journey Ventures, where I invest in the impossible, the underestimated, and the people rewriting the rules.never seen before."])</script><script>self.__next_f.push([1,"4:[\"$L15\",false,[\"$\",\"$L16\",null,{}],[\"$\",\"$L17\",null,{\"aboutMe\":{\"_createdAt\":\"2025-03-11T22:28:04Z\",\"_id\":\"aboutMe\",\"_rev\":\"rxTWt7rai7V5fzZh48Yuhd\",\"_type\":\"aboutMe\",\"_updatedAt\":\"2025-03-25T20:59:15Z\",\"description\":[{\"_key\":\"0f9db0bced38\",\"_type\":\"block\",\"children\":[{\"_key\":\"723639fcefb4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Some Day, I Am\"}],\"markDefs\":[],\"style\":\"h2\"},{\"_key\":\"a1ee1ae7d07e\",\"_type\":\"block\",\"children\":[{\"_key\":\"fd4f1f9a1310\",\"_type\":\"span\",\"marks\":[],\"text\":\"I wasn’t supposed to be here.\\n\\nI didn’t grow up thinking I’d be an investor, a founder, or someone making bets on the future. My childhood wasn’t filled with business lessons or insider connections—it was about survival, about figuring things out as I went.\\n\\nI left home at 15. I was homeless. No degree, no roadmap, just an unshakable curiosity and a deep belief that if I could understand how things worked—computers, systems, people—I could carve a path forward.\\n\\nI taught myself to code. I spent hours in libraries, stealing time on public computers, diving into books about programming and hacking. I took whatever jobs I could—cleaning offices, working in fast food, fixing whatever broken things I could find—just to get by. It wasn’t glamorous, but it gave me an edge: I knew how to see things differently.\\n\\nI wasn’t following a playbook. I was making my own.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2c3c9560f969\",\"_type\":\"image\",\"asset\":{\"_ref\":\"image-a54d9894f746d1f8df9badf7ec54dbad9fa97f11-546x276-jpg\",\"_type\":\"reference\"}},{\"_key\":\"2bad7529e23b\",\"_type\":\"block\",\"children\":[{\"_key\":\"c289ed595da4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Rolling the Dice\"}],\"markDefs\":[],\"style\":\"h2\"},{\"_key\":\"30a447307da3\",\"_type\":\"block\",\"children\":[{\"_key\":\"a46c437715a8\",\"_type\":\"span\",\"marks\":[],\"text\":\"$18\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b7e56b9a89e3\",\"_type\":\"image\",\"asset\":{\"_ref\":\"image-79aaaaabfc18335ec1ae9968276fad6567b59305-2048x1365-webp\",\"_type\":\"reference\"}},{\"_key\":\"eb73f729b39b\",\"_type\":\"block\",\"children\":[{\"_key\":\"9b5bacea7de1\",\"_type\":\"span\",\"marks\":[],\"text\":\"The Ugly Duckling Theory\"}],\"markDefs\":[],\"style\":\"h2\"},{\"_key\":\"709bee0c18ec\",\"_type\":\"block\",\"children\":[{\"_key\":\"0633b100fb6d\",\"_type\":\"span\",\"marks\":[],\"text\":\"I believe in the ones who don’t fit in. The outsiders, the misfits, the people with ideas too weird, too early, too uncomfortable.\\n\\nBecause that was me. And I know that the things that make you different today are the things that will make you unstoppable tomorrow.\\n\\nI don’t invest in safe ideas. I invest in the weird, the improbable, the ones everyone else underestimates. Because the best ideas—the ones that change everything—never seem obvious at the start.\\n\\nIf you’ve ever felt like the Ugly Duckling—the one nobody bets on, the one who doesn’t belong—just wait. Some day, you are something the world has never seen before.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"698840448cc0\",\"_type\":\"image\",\"asset\":{\"_ref\":\"image-31a80b7595291eb6d9c667405e8f807069a99ef6-546x276-jpg\",\"_type\":\"reference\"}},{\"_key\":\"35a2ff2b8ec6\",\"_type\":\"block\",\"children\":[{\"_key\":\"3855ee2ddd1b\",\"_type\":\"span\",\"marks\":[],\"text\":\"A Few Fun Facts About Me:\"}],\"markDefs\":[],\"style\":\"h2\"},{\"_key\":\"f78c32dd4251\",\"_type\":\"block\",\"children\":[{\"_key\":\"ceab96f80379\",\"_type\":\"span\",\"marks\":[],\"text\":\"I have an entire collection of dice and use them in my daily life to make decisions. It keeps life interesting.\"}],\"level\":1,\"listItem\":\"bullet\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"eed30f78190c\",\"_type\":\"block\",\"children\":[{\"_key\":\"dae52a661af9\",\"_type\":\"span\",\"marks\":[],\"text\":\"I believe curiosity is a superpower—the weirder the idea, the more interesting the conversation.\"}],\"level\":1,\"listItem\":\"bullet\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f9b1a153f4da\",\"_type\":\"block\",\"children\":[{\"_key\":\"04e280d2e81f\",\"_type\":\"span\",\"marks\":[],\"text\":\"I don’t believe in gatekeeping knowledge. If I can help, I w
