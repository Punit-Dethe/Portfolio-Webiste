_key\":\"192686e368af\",\"_type\":\"span\",\"marks\":[\"766f5bb80575\"],\"text\":\"Check them out here!\"}],\"markDefs\":[{\"_key\":\"766f5bb80575\",\"_type\":\"link\",\"href\":\"https://cyanbanister.com/?product=3b2058c6-af37-4714-b5f3-43e55067ed9f\"}],\"style\":\"normal\"}]},{\"_createdAt\":\"2025-03-01T08:12:37Z\",\"_id\":\"db6ccc3e-09da-4cb3-9689-a955b00326d6\",\"_rev\":\"gy2e9H66bryTOZFdAzgWRz\",\"_type\":\"stickyNote\",\"_updatedAt\":\"2025-03-01T08:13:46Z\",\"color\":\"pink\",\"content\":[{\"_key\":\"961426493c61\",\"_type\":\"block\",\"children\":[{\"_key\":\"5c97916a433c\",\"_type\":\"span\",\"marks\":[],\"text\":\"The moment I cease running experiments on my life is when the true experiment begins. \"},{\"_key\":\"d381c61bbd7d\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"What if all my searching was merely the cosmos teaching me\"},{\"_key\":\"7a040b6e1888\",\"_type\":\"span\",\"marks\":[],\"text\":\" how to be still enough to receive what was already mine? The dice roll themselves when I am truly present.\"}],\"markDefs\":[],\"style\":\"normal\"}]}],\"substackPosts\":[{\"_createdAt\":\"2025-04-12T13:00:23Z\",\"_id\":\"jAdw7GAXmOkBMXb3kbMfVK\",\"_rev\":\"jAdw7GAXmOkBMXb3kbMfTz\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-04-12T13:00:23Z\",\"name\":\"Sometimes mothers kick their daughters' boyfriends out in the middle of winter.\",\"publishedAt\":\"2025-04-12\",\"subtitle\":\"Patricia, my birth mother, permitted Cuddles to stay with us for perhaps a week before she expelled him from the house during the depths of winter.\",\"url\":\"https://uglyduckling.substack.com/p/sometimes-mothers-kick-their-daughters\"},{\"_createdAt\":\"2025-03-25T07:00:23Z\",\"_id\":\"P3AtwJlebqYbPE7RiX47YL\",\"_rev\":\"P3AtwJlebqYbPE7RiX47VK\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-03-25T07:00:23Z\",\"name\":\"Paper Squares and Prison Bars\",\"publishedAt\":\"2025-03-25\",\"subtitle\":\"I didn't want to tell this story, which is precisely why I should.\",\"url\":\"https://uglyduckling.substack.com/p/paper-squares-and-prison-bars\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"SFmeZvllcTepotsROkZGVP\",\"_rev\":\"8vpHZRZmaa8udNmyH2ZnKh\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-13T22:53:54Z\",\"name\":\"The cart path\",\"publishedAt\":\"2025-01-26\",\"subtitle\":\"An artist friend of mine gave me some advice many years ago.\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-cacfb3ec17baf3ff1a03de599d3c64a7607e4047-728x410-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/the-cart-path\"},{\"_createdAt\":\"2025-02-13T22:29:28Z\",\"_id\":\"SFmeZvllcTepotsROkVF1P\",\"_rev\":\"eYf7bIeX7iguLrfH4S44we\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:08:17Z\",\"name\":\"The Origins of Cyan \",\"order\":2,\"publishedAt\":\"2025-01-24\",\"subtitle\":\"Watch episode here:\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-fa22a3c9ad1c5a823f20213cbda39e0951aa96e2-1456x819-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/the-orgins-of-cyan\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"SFmeZvllcTepotsROkZGYP\",\"_rev\":\"8vpHZRZmaa8udNmyH2ZnIq\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-13T22:53:54Z\",\"name\":\"Tim Ferriss interview\",\"publishedAt\":\"2025-01-14\",\"subtitle\":\"When dreams come true...\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-7cca16f47229bb3a6b49b2e802f6b49c4dc82830-728x410-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/tim-ferriss-interview\"},{\"_createdAt\":\"2025-02-13T22:29:28Z\",\"_id\":\"45f1y27Y0JbIe5Yk5krih0\",\"_rev\":\"TchnuM9sO5uSljkgE4ngZ9\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:08:19Z\",\"name\":\"Hitchhiking with Jesus (40)\",\"order\":4,\"publishedAt\":\"2023-03-15\",\"subtitle\":\"Baby, it's cold outside.\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-a1fd47b2047357d26de260a58996eba8708568b0-1456x867-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/hitchhiking-with-jesus\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"45f1y27Y0JbIe5Yk5kuZAh\",\"_rev\":\"8vpHZRZmaa8udNmyH2ZnGz\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-13T22:53:56Z\",\"name\":\"Join my chat\",\"publishedAt\":\"2022-12-06\",\"subtitle\":\"A private space for us to converse and connect\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-a81bee7e3fd2d962a43b0eea609fd4d093b0e2e1-1456x743-png\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/join-my-chat\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"SFmeZvllcTepotsROkZGPP\",\"_rev\":\"SFmeZvllcTepotsROr0rQP\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:09:23Z\",\"name\":\"Commune Life (39)\",\"publishedAt\":\"2022-12-06\",\"subtitle\":\"The two men who dropped us off at the base of the commune decided they wanted to join us but failed to ask in all the many polite ways available.\",\"url\":\"https://uglyduckling.substack.com/p/commune-life-39\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"4IWvQAHLC63503PAHazpry\",\"_rev\":\"45f1y27Y0JbIe5Yk5ojm7z\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:09:48Z\",\"name\":\"The break is over..\",\"publishedAt\":\"2022-09-10\",\"subtitle\":\"Thank you for your patience and kindness....\",\"url\":\"https://uglyduckling.substack.com/p/the-break-is-over\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"SFmeZvllcTepotsROkZGSP\",\"_rev\":\"SFmeZvllcTepotsROr1D3P\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:09:56Z\",\"name\":\"(38) Meeting Karin.\",\"publishedAt\":\"2022-09-10\",\"subtitle\":\"Cuddles and I ran around downtown Tempe, Arizona, seemingly joined at the hip.\",\"url\":\"https://uglyduckling.substack.com/p/38-meeting-karin\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"45f1y27Y0JbIe5Yk5kuYzZ\",\"_rev\":\"SFmeZvllcTepotsROr1EJP\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:10:04Z\",\"name\":\"Everyone should ride on Greyhound at least once… (37)\",\"publishedAt\":\"2022-01-05\",\"subtitle\":\"The squatter life.\",\"url\":\"https://uglyduckling.substack.com/p/everyone-should-ride-on-greyhound\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"45f1y27Y0JbIe5Yk5kuZ6z\",\"_rev\":\"4IWvQAHLC63503PAHc9lnO\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:10:10Z\",\"name\":\"(35) Searching For Family and Home With Cuddles\",\"publishedAt\":\"2021-10-13\",\"subtitle\":\"We’ve come to the part where I’m going to embarrass myself—a lot.\",\"url\":\"https://uglyduckling.substack.com/p/35\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"4IWvQAHLC63503PAHazpvS\",\"_rev\":\"SFmeZvllcTepotsROr1UZP\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:10:18Z\",\"name\":\"Took a break but coming back! \",\"publishedAt\":\"2021-10-12\",\"subtitle\":\"The hard thing about spilling your guts online is that it has an emotional toll.\",\"url\":\"https://uglyduckling.substack.com/p/took-a-break-but-coming-back\"},{\"_createdAt\":\"2025-02-13T22:29:28Z\",\"_id\":\"45f1y27Y0JbIe5Yk5krioQ\",\"_rev\":\"6wd4lqO7Jb1qomh87WmcJm\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:03:49Z\",\"name\":\"Joyriding with the gutter punks (34)\",\"order\":12,\"publishedAt\":\"2021-06-18\",\"subtitle\":\"Towards the summer’s close, Ellyn went to the courthouse to get custody of me.\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-1914fc36305f9a7eeecd47532048a11b5924f5f7-768x600-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/joyriding-with-the-gutter-punks-34\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"45f1y27Y0JbIe5Yk5kuYvr\",\"_rev\":\"45f1y27Y0JbIe5Yk5okBUt\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:10:26Z\",\"name\":\"Ellyn Davis\",\"publishedAt\":\"2021-05-13\",\"subtitle\":\"A reader/follower of my Twitter feed found Ellyn.\",\"url\":\"https://uglyduckling.substack.com/p/ellyn-davis\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"4IWvQAHLC63503PAHazpxC\",\"_rev\":\"4IWvQAHLC63503PAHc9rJO\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:10:35Z\",\"name\":\"Better late than never (33)\",\"publishedAt\":\"2021-05-07\",\"subtitle\":\"I entered the Davis house with nothing but what was in my bag—the sum of all my possessions. I had neither toiletries nor underwear nor the simple sorts of things that make life bearable, survivable.\",\"url\":\"https://uglyduckling.substack.com/p/better-late-than-never-32\"},{\"_createdAt\":\"2025-02-13T22:29:28Z\",\"_id\":\"SFmeZvllcTepotsROkVF7P\",\"_rev\":\"xrX1Uw3gPMqaYg0VZ5Lf9g\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-13T22:53:54Z\",\"name\":\"Asshole watch (32)\",\"order\":15,\"publishedAt\":\"2021-04-28\",\"subtitle\":\"Josh and I saw each other every moment we could find.\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-93f927ac5213ca3abff614b0b271cea749a828b2-381x400-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/asshole-watch-32\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"4IWvQAHLC63503PAHazpsY\",\"_rev\":\"SFmeZvllcTepotsROr1vWP\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:10:42Z\",\"name\":\"Josh (31) \",\"publishedAt\":\"2021-04-15\",\"subtitle\":\"Life may be a video game, but some of us have a few of the cheat codes.\",\"url\":\"https://uglyduckling.substack.com/p/josh-31\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"4IWvQAHLC63503PAHazpw2\",\"_rev\":\"4IWvQAHLC63503PAHc9tx8\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:10:48Z\",\"name\":\"I did it, with a boy. (30)\",\"publishedAt\":\"2021-03-05\",\"subtitle\":\"I shaved my hair around the top of my ears and the back of my neck, so when I put up my hair in a ponytail or bun, it looked pretty badass, but when I put it down, my mother wouldn’t notice.\",\"url\":\"https://uglyduckling.substack.com/p/i-did-it-with-a-boy\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"45f1y27Y0JbIe5Yk5kuZ3H\",\"_rev\":\"4IWvQAHLC63503PAHc9uCE\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:10:56Z\",\"name\":\"The Bridge (29)\",\"publishedAt\":\"2021-01-28\",\"subtitle\":\"Sometimes you can’t begin again, even when you want to.\",\"url\":\"https://uglyduckling.substack.com/p/the-bridge-29\"},{\"_createdAt\":\"2025-02-13T22:29:28Z\",\"_id\":\"45f1y27Y0JbIe5Yk5kriki\",\"_rev\":\"4IWvQAHLC63503PAHb1SqU\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-13T22:53:54Z\",\"name\":\"I like freaking (28)\",\"order\":19,\"publishedAt\":\"2020-12-30\",\"subtitle\":\"The night that I saw Freddy at the library, I went to bed, confused.\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-3ff4df6301f52507dd8436ff7c82e9ad41753899-355x500-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/i-like-freaking-28\"},{\"_createdAt\":\"2025-02-13T22:34:24Z\",\"_id\":\"4IWvQAHLC63503PAHazpti\",\"_rev\":\"SFmeZvllcTepotsROr2AxP\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T17:11:03Z\",\"name\":\"How about some pie? (27)\",\"publishedAt\":\"2020-12-13\",\"subtitle\":\"I managed to make a few new friends at school.\",\"url\":\"https://uglyduckling.substack.com/p/how-about-some-pie-27\"},{\"_createdAt\":\"2025-02-14T16:15:48Z\",\"_id\":\"4IWvQAHLC63503PAHc61c2\",\"_rev\":\"4IWvQAHLC63503PAHc61as\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:48Z\",\"name\":\"Slow down. (26) \",\"publishedAt\":\"2020-12-10\",\"subtitle\":\"When I returned back from church camp, life began to feel like a broken record, which is one of the worst feelings in the world.\",\"url\":\"https://uglyduckling.substack.com/p/slow-down\"},{\"_createdAt\":\"2025-02-14T16:15:50Z\",\"_id\":\"SFmeZvllcTepotsROqeOqP\",\"_rev\":\"SFmeZvllcTepotsROqeOnP\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:50Z\",\"name\":\"I'm so high, I swear I could fly... (25)\",\"publishedAt\":\"2020-11-25\",\"subtitle\":\"Lucky for me, my sister left some t-shirts in her room that Grandma allowed me to wear until we could go to town.\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-3955c12c46f98caddea7b7912fc511244795f00f-480x360-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/im-so-high-i-swear-i-could-fly\"},{\"_createdAt\":\"2025-02-14T16:15:48Z\",\"_id\":\"45f1y27Y0JbIe5Yk5oTwuz\",\"_rev\":\"45f1y27Y0JbIe5Yk5oTwt8\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:48Z\",\"name\":\"Zoom dinner party\",\"publishedAt\":\"2020-11-14\",\"subtitle\":\"Hello lovely subscribers!\",\"url\":\"https://uglyduckling.substack.com/p/zoom-dinner-party\"},{\"_createdAt\":\"2025-02-14T16:15:48Z\",\"_id\":\"SFmeZvllcTepotsROqeLtP\",\"_rev\":\"SFmeZvllcTepotsROqeLqP\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:48Z\",\"name\":\"You have AIDS (24)\",\"publishedAt\":\"2020-11-13\",\"subtitle\":\"The nice thing about my newspaper job is that it gave my life some structure and purpose.\",\"url\":\"https://uglyduckling.substack.com/p/you-have-aids-23\"},{\"_createdAt\":\"2025-02-14T16:15:48Z\",\"_id\":\"45f1y27Y0JbIe5Yk5oTwnZ\",\"_rev\":\"45f1y27Y0JbIe5Yk5oTwli\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:48Z\",\"name\":\"Arizona Daily Sun (23)\",\"publishedAt\":\"2020-11-12\",\"subtitle\":\"Know your worth\",\"url\":\"https://uglyduckling.substack.com/p/arizona-daily-sun\"},{\"_createdAt\":\"2025-02-14T16:15:48Z\",\"_id\":\"SFmeZvllcTepotsROqeMBP\",\"_rev\":\"SFmeZvllcTepotsROqeM8P\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:48Z\",\"name\":\"Spirit Week (22)\",\"publishedAt\":\"2020-11-03\",\"subtitle\":\"and an honest living\",\"url\":\"https://uglyduckling.substack.com/p/spirit-week\"},{\"_createdAt\":\"2025-02-14T16:15:48Z\",\"_id\":\"SFmeZvllcTepotsROqeLhP\",\"_rev\ y admit that I had a hard time managing my emotions about Beverly.\",\"url\":\"https://uglyduckling.substack.com/p/dick-nose\"},{\"_createdAt\":\"2025-02-14T16:15:48Z\",\"_id\":\"4IWvQAHLC63503PAHc61YY\",\"_rev\":\"4IWvQAHLC63503PAHc61Xy\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:48Z\",\"name\":\"Zoom dinner?\",\"publishedAt\":\"2020-08-20\",\"subtitle\":\"Hello subscribers!\",\"url\":\"https://uglyduckling.substack.com/p/zoom-dinner\"},{\"_createdAt\":\"2025-02-14T16:15:49Z\",\"_id\":\"45f1y27Y0JbIe5Yk5oTx7y\",\"_rev\":\"45f1y27Y0JbIe5Yk5oTx67\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:49Z\",\"name\":\"Beverly (16)\",\"publishedAt\":\"2020-08-13\",\"subtitle\":\"She's a punk punk, a punk rocker\",\"url\":\"https://uglyduckling.substack.com/p/beverly-16\"},{\"_createdAt\":\"2025-02-14T16:15:48Z\",\"_id\":\"SFmeZvllcTepotsROqeM5P\",\"_rev\":\"SFmeZvllcTepotsROqeM2P\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:48Z\",\"name\":\"Wolfie (15)\",\"publishedAt\":\"2020-08-03\",\"subtitle\":\"In the summer before the 6th grade, I experienced many transformations.\",\"url\":\"https://uglyduckling.substack.com/p/wolfie-15\"},{\"_createdAt\":\"2025-02-14T16:15:50Z\",\"_id\":\"4IWvQAHLC63503PAHc62FW\",\"_rev\":\"4IWvQAHLC63503PAHc62Ew\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:50Z\",\"name\":\"1987 part 2 (14)\",\"publishedAt\":\"2020-07-31\",\"subtitle\":\"Towards the latter half of the 5th grade, the school opened up a computer lab, and I was allowed to visit it two times a week with Mrs.\",\"thumbnail\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-794b98064bff7a2d215b0ad9dbed87edeb76331f-360x434-jpg\",\"_type\":\"reference\"}},\"url\":\"https://uglyduckling.substack.com/p/1987-part-2-14\"},{\"_createdAt\":\"2025-02-14T16:15:49Z\",\"_id\":\"SFmeZvllcTepotsROqeMrP\",\"_rev\":\"SFmeZvllcTepotsROqeMoP\",\"_type\":\"substack-post\",\"_updatedAt\":\"2025-02-14T16:15:49Z\",\"name\":\"1987 (13) \",\
