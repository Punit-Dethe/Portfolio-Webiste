der\",\"_updatedAt\":\"2025-03-25T22:27:06Z\",\"order\":2,\"title\":\"Growth\"},{\"_createdAt\":\"2025-02-06T20:25:19Z\",\"_id\":\"f785daa1-2f1f-4960-87dd-fb70334cd1cf\",\"_rev\":\"YaHF80d3aTO0ftBnpsB1mw\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-03T04:56:37Z\",\"icon\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-15542cfe313d7167918c18a9fff1bfdf4b287779-96x96-svg\",\"_type\":\"reference\"}},\"order\":2,\"title\":\"Founders Fund\"},{\"_createdAt\":\"2025-02-06T20:24:59Z\",\"_id\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_rev\":\"acbHj2fSluNtatz7806mo2\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-25T22:27:23Z\",\"folder\":{\"_ref\":\"afbc3109-751a-4400-82b1-39a5697127af\",\"_type\":\"reference\"},\"order\":3,\"title\":\"Unicorns\"},{\"_createdAt\":\"2025-02-06T20:25:34Z\",\"_id\":\"6a685aac-9172-4ca9-9eb4-910d2786bd03\",\"_rev\":\"rxTWt7rai7V5fzZh48e77v\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-25T21:26:48Z\",\"folder\":{\"_ref\":\"f785daa1-2f1f-4960-87dd-fb70334cd1cf\",\"_type\":\"reference\"},\"order\":3,\"title\":\"Unicorns\"},{\"_createdAt\":\"2025-02-19T03:06:11Z\",\"_id\":\"88ae133c-158f-4d18-8482-f827c25a7bdc\",\"_rev\":\"LkeFT6GdaS5o81PVibTTIV\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-25T22:29:09Z\",\"folder\":{\"_ref\":\"f785daa1-2f1f-4960-87dd-fb70334cd1cf\",\"_type\":\"reference\"},\"order\":3,\"title\":\"Decacorns\"},{\"_createdAt\":\"2025-02-06T20:26:07Z\",\"_id\":\"aca6ba40-9adb-45ac-991f-4ba713044dc1\",\"_rev\":\"rxTWt7rai7V5fzZh48e2Et\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-25T21:26:10Z\",\"folder\":{\"_ref\":\"bece5a2d-abc6-442c-8ef4-183889469cf8\",\"_type\":\"reference\"},\"order\":3,\"title\":\"Unicorns\"},{\"_createdAt\":\"2025-02-06T20:25:53Z\",\"_id\":\"bece5a2d-abc6-442c-8ef4-183889469cf8\",\"_rev\":\"YaHF80d3aTO0ftBnpsB1Vg\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-03T04:56:34Z\",\"icon\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-5639caff204201a3c9e41d6bbff395c3f0c1bbb7-96x96-svg\",\"_type\":\"reference\"}},\"order\":3,\"title\":\"Long Journey\"},{\"_createdAt\":\"2025-02-19T01:34:36Z\",\"_id\":\"7d0a19cf-da07-482e-b5a1-8065ecfa510a\",\"_rev\":\"acbHj2fSluNtatz77zoosj\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-25T21:27:27Z\",\"folder\":{\"_ref\":\"afbc3109-751a-4400-82b1-39a5697127af\",\"_type\":\"reference\"},\"order\":4,\"title\":\"Decacorns\"},{\"_createdAt\":\"2025-02-19T01:44:34Z\",\"_id\":\"c2ba67b4-1dee-4b6c-8be2-32ca98d1966a\",\"_rev\":\"gy2e9H66bryTOZFdB65zyD\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-03T04:59:04Z\",\"folder\":{\"_ref\":\"bece5a2d-abc6-442c-8ef4-183889469cf8\",\"_type\":\"reference\"},\"order\":4,\"title\":\"Concentration\"},{\"_createdAt\":\"2025-02-06T20:24:41Z\",\"_id\":\"a0ced8b8-14d6-40eb-b0b4-8664f83e15bd\",\"_rev\":\"rxTWt7rai7V5fzZh48lkuN\",\"_type\":\"investmentFolder\",\"_updatedAt\":\"2025-03-25T22:27:51Z\",\"order\":5,\"title\":\"Exited\"}],\"investments\":[{\"_createdAt\":\"2025-02-04T22:33:46Z\",\"_id\":\"7a0a0c6d-1a67-43a4-91e2-078da9aa0ae8\",\"_rev\":\"qHhNQIW6XHipcCVopwUoWc\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:55:24Z\",\"description\":[{\"_key\":\"d142ecca5314\",\"_type\":\"block\",\"children\":[{\"_key\":\"2d3cd89c9235\",\"_type\":\"span\",\"marks\":[],\"text\":\"Credit cards were designed to trap people in debt—high-interest rates, hidden fees, and a business model built on keeping balances unpaid. Affirm flipped the script, giving consumers a transparent, responsible way to pay over time.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8a78ea4227f0\",\"_type\":\"block\",\"children\":[{\"_key\":\"0157edc2a11e\",\"_type\":\"span\",\"marks\":[],\"text\":\"Their “buy now, pay later” model wasn’t just a payment option—it was a shift in financial power. No late fees, no compounding interest, just clear terms that let people make purchases without the usual credit card pitfalls. Merchants won too, with higher conversions and bigger sales.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6e549c9eaa34\",\"_type\":\"block\",\"children\":[{\"_key\":\"2533ade2f674\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because financial products should work for people, not against them. Affirm wasn’t just modernizing payments—they were making credit fair. In a world where trust in banks is eroding, they built a system that earns it back.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"eb71f66f3434\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2012,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Public\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-f7bd6db449d7d53504bf356986e963b5ea237035-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Affirm\",\"order\":0,\"subtitle\":\"Buy now, pay later financing\",\"url\":\"https://www.affirm.com\"},{\"_createdAt\":\"2025-02-19T03:36:11Z\",\"_id\":\"e26d401f-96de-4fb4-8185-a7bf439863bb\",\"_rev\":\"qHhNQIW6XHipcCVopwSVnp\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:37:15Z\",\"description\":[{\"_key\":\"66dede385494\",\"_type\":\"block\",\"children\":[{\"_key\":\"fbc6716a2496\",\"_type\":\"span\",\"marks\":[],\"text\":\"Police officers spend nearly a third of their shifts on paperwork, taking time away from public safety. Abel Police changes that by turning body cam footage into automated reports, cutting administrative work and letting officers focus on real policing. This could effectively increase police availability by up to 50%.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"00731d9eaf3a\",\"_type\":\"block\",\"children\":[{\"_key\":\"257f5d6a1433\",\"_type\":\"span\",\"marks\":[],\"text\":\"The team, led by Daniel Francis, deeply understands the problem and has built a solution with strong early traction. Backed by Y Combinator and a $5M seed round, Abel Police is positioned to transform law enforcement efficiency.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bb5854ed3334\",\"_type\":\"block\",\"children\":[{\"_key\":\"0bc8160ac722\",\"_type\":\"span\",\"marks\":[],\"text\":\"This isn’t just about saving time—it’s about making communities safer. Abel Police is building the future of law enforcement tech, and I’m excited to support it.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"fb616e1db21a\",\"_ref\":\"3da61aea-b6be-4091-906d-65fe45a3e42c\",\"_type\":\"reference\"}],\"foundedYear\":2024,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Seed\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-ac7d3b2d7034ec9f83d84f4a79819b6337372ada-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Abel\",\"subtitle\":\"Automated police report generation tool\",\"url\":\"https://abelpolice.com/\"},{\"_createdAt\":\"2025-02-04T21:11:38Z\",\"_id\":\"d156ad5b-107e-4345-a844-c8e4f5213c77\",\"_rev\":\"1gjDXMmy1t5S4ZgXuptCW1\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:55:09Z\",\"description\":[{\"_key\":\"55f20c1828df\",\"_type\":\"block\",\"children\":[{\"_key\":\"17b3907e73f3\",\"_type\":\"span\",\"marks\":[],\"text\":\"Defense tech was stuck in the past—slow, expensive, built for a different era. Meanwhile, threats were evolving faster than the systems meant to stop them. Anduril saw the gap and moved fast.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a9f01851a457\",\"_type\":\"block\",\"children\":[{\"_key\":\"a535b5c1104f\",\"_type\":\"span\",\"marks\":[],\"text\":\"They weren’t bidding on outdated government contracts. They were building the future—autonomous defense systems, AI-powered surveillance, and software-driven security that adapted in real time. Their technology didn’t just supplement military operations; it redefined them.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"da7af64251d4\",\"_type\":\"block\",\"children\":[{\"_key\":\"35505f98e307\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because national security isn’t optional, and innovation can’t wait. Anduril’s approach wasn’t about playing by old rules—it was about rewriting them. In a world where defense needs to move at startup speed, they’re the only ones moving fast enough.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"8c5ad996bcb1\",\"_ref\":\"7d0a19cf-da07-482e-b5a1-8065ecfa510a\",\"_type\":\"reference\"}],\"foundedYear\":2017,\"hq\":\"Costa Mesa, CA\",\"investmentRound\":\"Series F\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-81f768167ef8444f2d24552e127c4f54b6d2500e-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Anduril\",\"subtitle\":\"Transforming defense with autonomous systems\",\"url\":\"https://www.anduril.com\"},{\"_createdAt\":\"2025-02-04T23:12:01Z\",\"_id\":\"2d9eb776-1529-46ff-8c8d-b09e12aae937\",\"_rev\":\"1gjDXMmy1t5S4ZgXuptFZt\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:56:56Z\",\"description\":[{\"_key\":\"dbf6107c3ae9\",\"_type\":\"block\",\"children\":[{\"_key\":\"c09a8209e3a9\",\"_type\":\"span\",\"marks\":[],\"text\":\"The trucking industry runs on thin margins, yet one of its biggest costs—fuel—has been bogged down by inefficiencies, high fees, and outdated payment systems. AtoB saw an opportunity to fix it, giving fleets modern financial tools to cut costs and operate more efficiently.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"98a87c8e0c1d\",\"_type\":\"block\",\"children\":[{\"_key\":\"6398f39979c0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Their fuel card and payment platform replace predatory fees with transparency, streamline expenses, and offer real-time financial insights that trucking companies have never had before. It’s more than just payments—it’s the financial backbone for an industry that keeps the world moving.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a1c7f80a5f91\",\"_type\":\"block\",\"children\":[{\"_key\":\"3b43b6655ae5\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because logistics shouldn’t be held back by broken financial infrastructure. AtoB isn’t just making payments easier for truckers—they’re building a smarter, more resilient supply chain. When you remove friction from the system, everything moves faster.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"0d25ae99075d\",\"_ref\":\"aca6ba40-9adb-45ac-991f-4ba713044dc1\",\"_type\":\"reference\"}],\"foundedYear\":2019,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Series C\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-0b35fe692f5e8586e6cc44423bef99a015b8dfa8-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"AtoB\",\"subtitle\":\"Trucking fuel \u0026 fleet payment infrastructure\",\"url\":\"https://www.atob.com/\"},{\"_createdAt\":\"2025-02-19T03:01:15Z\",\"_id\":\"7d1816f7-52b8-43ec-a835-1dd4159e7a9a\",\"_rev\":\"1gjDXMmy1t5S4ZgXupslcP\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:06:31Z\",\"description\":[{\"_key\":\"e7b1a32d959b\",\"_type\":\"block\",\"children\":[{\"_key\":\"a8eb44afc9f6\",\"_type\":\"span\",\"marks\":[],\"text\":\"Brave is redefining the internet by prioritizing privacy, speed, and user control over traditional ad-driven models. Unlike mainstream browsers that monetize user data, Brave blocks invasive tracking by default, offering a faster, more secure experience. With rising privacy concerns, demand for ethical, user-first alternatives is growing.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1f63c5f04438\",\"_type\":\"block\",\"children\":[{\"_key\":\"c35e34f80e4a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Beyond security, Brave introduces a new economic model, allowing users to earn Basic Attention Tokens (BAT) for engaging with privacy-respecting ads. This shifts value back to users and content creators while integrating Web3 technologies, a built-in wallet, and decentralized search, positioning Brave at the forefront of the next internet era.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"36c0a007a575\",\"_type\":\"block\",\"children\":[{\"_key\":\"d10e6191a426\",\"_type\":\"span\",\"marks\":[],\"text\":\"With strong product-market fit and regulatory tailwinds favoring privacy-first solutions, Brave is poised to disrupt the browser market. This investment isn’t just about a browser—it’s about backing the future of a user-controlled, decentralized web.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"f95c7147c025\",\"_ref\":\"88ae133c-158f-4d18-8482-f827c25a7bdc\",\"_type\":\"reference\"}],\"foundedYear\":2015,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Series B\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-804b07a1d74d6ba53706110e9448d8352aa29e07-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Brave \",\"subtitle\":\"Private, fast, crypto-rewarding, ad-blocking browser\",\"url\":\"https://brave.com/\"},{\"_createdAt\":\"2025-02-04T21:14:26Z\",\"_id\":\"edcb9578-b7fb-45a3-80a1-168bbd9b9af5\",\"_rev\":\"1gjDXMmy1t5S4ZgXupsnav\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:30Z\",\"description\":[{\"_key\":\"596ce2be8c64\",\"_type\":\"block\",\"children\":[{\"_key\":\"f439bd0d1e60\",\"_type\":\"span\",\"marks\":[],\"text\":\"Equity is the backbone of startups, yet for years, cap tables were a mess—spreadsheet errors, outdated records, and endless confusion over who owned what. Carta fixed that.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e03d62da07c3\",\"_type\":\"block\",\"children\":[{\"_key\":\"acd04cc19a66\",\"_type\":\"span\",\"marks\":[],\"text\":\"They turned equity management into software, making ownership transparent, automated, and impossible to screw up. Founders, investors, and employees finally had a clear picture of their stakes in real time. It wasn’t just about cleaning up cap tables; it was about making private markets liquid and investable.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f09936312734\",\"_type\":\"block\",\"children\":[{\"_key\":\"1d5d5ccec07b\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because equity is power, and access to that power shouldn’t be limited to a select few. Carta didn’t just streamline paperwork—they built the infrastructure for a new financial system where ownership is as fluid as the companies being built.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"42f8cf1414f0\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2012,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Series G\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-58e25ca9d33755979b1520cb21358d05caffd6f7-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Carta\",\"subtitle\":\"Simplifying equity management for companies\",\"url\":\"https://www.carta.com\"},{\"_createdAt\":\"2025-02-04T21:17:40Z\",\"_id\":\"88fd5352-383e-4dd6-8a8c-9e26b85d969b\",\"_rev\":\"itvkhwxEA2FOFySb8fl84N\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:57:10Z\",\"description\":[{\"_key\":\"9e69d1d863c4\",\"_type\":\"block\",\"children\":[{\"_key\":\"cb501f08738a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Data centers are power-hungry giants, while flared natural gas burns off as wasted energy. Two problems, one elegant solution—Crusoe Cloud. They saw an opportunity where others saw inefficiency, capturing stranded energy to power the future of AI and cloud computing.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d07834db6416\",\"_type\":\"block\",\"children\":[{\"_key\":\"4a9de18865fb\",\"_type\":\"span\",\"marks\":[],\"text\":\"By repurposing wasted gas to run high-performance computing infrastructure, Crusoe built a cloud that’s both cost-efficient and environmentally responsible. Instead of contributing to the climate crisis, they’re turning excess emissions into a competitive advantage.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9bdc875bcb74\",\"_type\":\"block\",\"children\":[{\"_key\":\"a029d366e40b\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because sustainability and scale shouldn’t be at odds. Crusoe Cloud isn’t just building better infrastructure; they’re proving that the future of computing doesn’t have to come at the planet’s expense.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"4c8bc4b1e55c\",\"_ref\":\"aca6ba40-9adb-45ac-991f-4ba713044dc1\",\"_type\":\"reference\"}],\"foundedYear\":2018,\"hq\":\"Denver, CO\",\"investmentRound\":\"Series D\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-bc0373bef620c3a077d53aaaf8a796bd9d6ce0ec-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Crusoe Cloud\",\"subtitle\":\"Sustainable cloud computing for AI\",\"url\":\"https://crusoe.ai\"},{\"_createdAt\":\"2025-02-04T21:12:16Z\",\"_id\":\"2f56d48b-4b90-4e9d-9a0d-11daaf7c55d4\",\"_rev\":\"qHhNQIW6XHipcCVopwSoEa\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:40Z\",\"description\":[{\"_key\":\"c05047396df3\",\"_type\":\"block\",\"children\":[{\"_key\":\"522318db26b6\",\"_type\":\"span\",\"marks\":[],\"text\":\"AI has always been one of those fields where people talk a big game, but real breakthroughs are rare. Everyone was promising intelligence, but all we got were smarter search algorithms and better ad targeting. Then DeepMind came along and changed everything.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"c0f77b370662\",\"_type\":\"block\",\"children\":[{\"_key\":\"9df2226307d6\",\"_type\":\"span\",\"marks\":[],\"text\":\"What made DeepMind different wasn’t just that they were building AI—it was how they were building it. They weren’t optimizing for short-term profits or incremental improvements. They were tackling the hardest problems in artificial intelligence with a level of ambition that felt almost reckless. Teaching an AI to play Atari was cool. Teaching it to master Go at a superhuman level was a turning point.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6b42ad8b2a79\",\"_type\":\"block\",\"children\":[{\"_key\":\"c84fbe6bbfce\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested in DeepMind because I believe intelligence is the most powerful force in the universe, and they were serious about pushing its boundaries. They weren’t just focused on research for the sake of research—they were applying AI to real-world problems, from energy efficiency to protein folding. The impact of what they were building was massive, and they weren’t waiting for permission to do it.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6ded5758450c\",\"_type\":\"block\",\"children\":[{\"_key\":\"19a59735672a\",\"_type\":\"span\",\"marks\":[],\"text\":\"AI isn’t just about automation or convenience. It’s about solving problems humans can’t. DeepMind saw that before most people did, and they had the technical talent, vision, and execution to make it happen. Betting on them wasn’t about what they could do in the next five years—it was about what they could do in the next fifty.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"d80c8f35a7d7\",\"_ref\":\"a0ced8b8-14d6-40eb-b0b4-8664f83e15bd\",\"_type\":\"reference\"}],\"foundedYear\":2010,\"hq\":\"London, UK\",\"investmentRound\":\"Acquired by Google\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-7ff8ce6cd9abd8b61b0c2837952650e9e6e57de2-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"DeepMind\",\"subtitle\":\"Advancing AI to solve global challenges\",\"url\":\"https://www.deepmind.com\"},{\"_createdAt\":\"2025-02-04T21:17:10Z\",\"_id\":\"46706096-b393-47cc-8f55-e5ff3b6ab31e\",\"_rev\":\"qHhNQIW6XHipcCVopwSgSX\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:10Z\",\"description\":[{\"_key\":\"9b9dec443f8d\",\"_type\":\"block\",\"children\":[{\"_key\":\"5515696ccfcb\",\"_type\":\"span\",\"marks\":[],\"text\":\"For decades, companies made decisions about space with guesswork. How many desks do we need? How much real estate is wasted? Are buildings actually being used the way we think? Density replaced assumptions with real data.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2a86431ac0a3\",\"_type\":\"block\",\"children\":[{\"_key\":\"169b14123375\",\"_type\":\"span\",\"marks\":[],\"text\":\"Their sensors measure real-time occupancy without invading privacy—no cameras, no tracking individuals, just pure spatial intelligence. Suddenly, companies could optimize offices, reduce waste, and design workplaces that actually fit how people work.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f4fafb2a2be0\",\"_type\":\"block\",\"children\":[{\"_key\":\"d1a2544f18c5\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because space is one of the biggest hidden costs in business. Density wasn’t just building hardware; they were creating a new category—actionable data for the physical world. In a world shifting toward hybrid work, that insight is invaluable.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"8ff4338bbb82\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"},{\"_key\":\"624cae5d6d68\",\"_ref\":\"a1281724-6561-4f3f-855d-3460f2d17bf7\",\"_type\":\"reference\"},{\"_key\":\"3364d28a3940\",\"_ref\":\"c2ba67b4-1dee-4b6c-8be2-32ca98d1966a\",\"_type\":\"reference\"}],\"foundedYear\":2014,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Series D\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-7a89c6aa3b8c84f8e03cf0a8175278a27be854dc-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Density\",\"subtitle\":\"Offering real-time occupancy data for workplaces\",\"url\":\"https://www.density.io\"},{\"_createdAt\":\"2025-02-04T23:11:03Z\",\"_id\":\"e81767db-a98f-4f98-b984-60c77e3d9eae\",\"_rev\":\"1gjDXMmy1t5S4ZgXupsmg1\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:13Z\",\"description\":[{\"_key\":\"a1082f0d8a88\",\"_type\":\"block\",\"children\":[{\"_key\":\"765caf742cf3\",\"_type\":\"span\",\"marks\":[],\"text\":\"The diamond industry has been built on artificial scarcity, environmental destruction, and ethical compromises. But what if you could grow a perfect diamond—one that’s identical to mined stones, but without the blood, waste, or cartel pricing? That’s exactly what Diamond Foundry did.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"970c2339904e\",\"_type\":\"block\",\"children\":[{\"_key\":\"6d5ed9994d6f\",\"_type\":\"span\",\"marks\":[],\"text\":\"Using cutting-edge plasma reactor technology, they created diamonds atom by atom, with the same brilliance and structure as natural ones. No mining, no middlemen, just ethically sourced, sustainably made diamonds at scale.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"34a9a93e2fdf\",\"_type\":\"block\",\"children\":[{\"_key\":\"93169001643a\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because innovation should replace exploitation. Diamond Foundry didn’t just challenge an outdated industry—they built a better, more transparent way to create something rare. The future of luxury isn’t mined from the ground; it’s made with technology.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"f11a05e8d27a\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"},{\"_key\":\"6e0e94da6e20\",\"_ref\":\"c2ba67b4-1dee-4b6c-8be2-32ca98d1966a\",\"_type\":\"reference\"}],\"foundedYear\":2012,\"hq\":\"San Carlos, CA\",\"investmentRound\":\"Series C\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-57593caf32349295c8a04405b9314fc1e2da76ca-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Diamond Foundry\",\"subtitle\":\"Lab-grown diamond production\",\"url\":\"https://www.diamondfoundry.com\"},{\"_createdAt\":\"2025-02-04T22:35:38Z\",\"_id\":\"1b0ba587-fb6e-400c-9bbe-78e7222b0ee3\",\"_rev\":\"qHhNQIW6XHipcCVopwV27M\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:57:31Z\",\"description\":[{\"_key\":\"bb1445a18601\",\"_type\":\"block\",\"children\":[{\"_key\":\"db3e80c11647\",\"_type\":\"span\",\"marks\":[],\"text\":\"Privacy shouldn’t be a premium feature. For years, search engines collected, tracked, and sold user data with no real alternative. DuckDuckGo proved there was another way—one where privacy wasn’t an afterthought, but the foundation.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"952fb7362ff8\",\"_type\":\"block\",\"children\":[{\"_key\":\"172a7571baa0\",\"_type\":\"span\",\"marks\":[],\"text\":\"They built a search engine that delivers great results without surveillance. No tracking, no filter bubbles, no creepy ads following you around. Just fast, unbiased search that respects users instead of exploiting them.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"caa41641549e\",\"_type\":\"block\",\"children\":[{\"_key\":\"93dac3055a0e\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because the internet wasn’t meant to be a data-mining operation. DuckDuckGo didn’t just build a private search engine—they built a movement. In a world where people are waking up to digital privacy, they were ahead of the curve.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"cbabafe5854c\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2008,\"hq\":\"Paoli, PA\",\"investmentRound\":\"Private\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-813fcb8cdd3c91f1a5b2996b36bd2cc5c95aff77-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"DuckDuckGo\",\"subtitle\":\"Privacy-focused search engine\",\"url\":\"https://www.duckduckgo.com\"},{\"_createdAt\":\"2025-02-04T21:16:06Z\",\"_id\":\"b73b6c32-5c2d-40c2-bc85-baf2b7e15590\",\"_rev\":\"itvkhwxEA2FOFySb8fhcWf\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:19Z\",\"description\":[{\"_key\":\"2cb7473604a9\",\"_type\":\"block\",\"children\":[{\"_key\":\"254f1d518835\",\"_type\":\"span\",\"marks\":[],\"text\":\"Data is only useful if you can actually access it, but for years, companies struggled with messy pipelines, broken integrations, and engineers wasting time on maintenance instead of insights. Fivetran changed that.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d811a2510fea\",\"_type\":\"block\",\"children\":[{\"_key\":\"c7cd69ca5a24\",\"_type\":\"span\",\"marks\":[],\"text\":\"They built fully automated data connectors that just worked—no custom scripts, no ongoing maintenance, just seamless movement of data from one system to another. It wasn’t glamorous, but it was critical. They turned an expensive, manual process into a plug-and-play solution that scaled effortlessly.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f4e6761ae4e3\",\"_type\":\"block\",\"children\":[{\"_key\":\"1f2e99181b6c\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because the future belongs to companies that make complexity invisible. Fivetran wasn’t just improving data infrastructure; they were removing friction from an entire industry. When something this foundational works flawlessly, you stop noticing it—but you can’t build without it.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8282efd2e81a\",\"_type\":\"block\",\"children\":[{\"_key\":\"af39dc41a5e7\",\"_type\":\"span\",\"marks\":[],\"text\":\"\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"92df221bdd9e\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2012,\"hq\":\"Oakland, CA\",\"investmentRound\":\"Series D\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-4056d5e2e735fdda7b8429c9e50d62e0ca48fa8a-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Fivetran\",\"subtitle\":\"Data pipeline automation\",\"url\":\"https://www.fivetran.com\"},{\"_createdAt\":\"2025-02-19T03:27:13Z\",\"_id\":\"fb979ca2-e7bd-4faf-a0b4-213062162c28\",\"_rev\":\"LkeFT6GdaS5o81PVibTNVd\",\"_type\":\"investment\",\"_updatedAt\":\"2025-03-25T22:25:53Z\",\"description\":[{\"_key\":\"5cf28af70439\",\"_type\":\"block\",\"children\":[{\"_key\":\"b77b5e7a4469\",\"_type\":\"span\",\"marks\":[],\"text\":\"The fashion supply chain has been broken for too long, making it difficult for emerging brands to scale. Melengo changes that with an end-to-end platform that streamlines design, sourcing, and production, leveraging AI to make high-quality manufacturing accessible. With low minimum order quantities and flexible financing, it removes barriers that have traditionally stifled creativity and growth.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e13374ead25f\",\"_type\":\"block\",\"children\":[{\"_key\":\"e026e12d9780\",\"_type\":\"span\",\"marks\":[],\"text\":\"What convinced me was the execution. Founders with deep industry experience are solving real pain points, and early traction with brands like Under Armour proves demand. Their vertically integrated approach ensures efficiency while giving brands full control over their supply chain.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"50dcc4242870\",\"_type\":\"block\",\"children\":[{\"_key\":\"6ba3e6a7ca3c\",\"_type\":\"span\",\"marks\":[],\"text\":\"This is more than just another manufacturing solution—it’s a foundational shift in how fashion brands launch and scale. With the right team and tech, Melengo is positioned to lead the next era of fashion production.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"9770f42946d9\",\"_ref\":\"3da61aea-b6be-4091-906d-65fe45a3e42c\",\"_type\":\"reference\"},{\"_key\":\"cc2181b55fcd\",\"_ref\":\"41c0111c-cc22-408c-9137-5bfdce10d52d\",\"_type\":\"reference\"}],\"foundedYear\":2023,\"hq\":\"Los Angeles, CA\",\"investmentRound\":\"Seed\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-149c677055a5916a645053de05fb3e0929797e61-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Flair\",\"subtitle\":\"End-to-end clothing manufacturing platform\",\"url\":\"https://www.melengo.com/\"},{\"_createdAt\":\"2025-02-04T21:15:38Z\",\"_id\":\"10acab2c-eb07-4c41-bda0-2eb905cdf2de\",\"_rev\":\"1gjDXMmy1t5S4ZgXupsnTN\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:23Z\",\"description\":[{\"_key\":\"650de027b09c\",\"_type\":\"block\",\"children\":[{\"_key\":\"9303b71f134e\",\"_type\":\"span\",\"marks\":[],\"text\":\"Global trade is the backbone of modern economies, yet for decades, it ran on outdated systems—paperwork, phone calls, and opaque supply chains that left businesses guessing. Flexport saw the inefficiencies and built a better way.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1b4266c199b5\",\"_type\":\"block\",\"children\":[{\"_key\":\"9ae024ac5fd4\",\"_type\":\"span\",\"marks\":[],\"text\":\"They took an industry drowning in bureaucracy and digitized it. Real-time tracking, automated customs clearance, and data-driven logistics replaced the old-school approach of spreadsheets and gut instincts. Suddenly, companies had visibility and control over their supply chains like never before.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a6b617ee43cd\",\"_type\":\"block\",\"children\":[{\"_key\":\"e649925ba84d\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because moving goods should be as seamless as moving information. Flexport wasn’t just optimizing shipping; they were modernizing global trade. In a world where supply chain agility defines success, they built the infrastructure to keep the world moving.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"f879f1432092\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2013,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Private\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-ddea1dc89d8de24a65a09f29236458532ce05b2a-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Flexport\",\"subtitle\":\"Streamlining global trade with digital logistics\",\"url\":\"https://www.flexport.com\"},{\"_createdAt\":\"2025-02-04T21:16:41Z\",\"_id\":\"c065962f-0bd1-41ec-8c2d-f1fe51e3618d\",\"_rev\":\"1gjDXMmy1t5S4ZgXupslpl\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:44:46Z\",\"description\":[{\"_key\":\"beb724277fdf\",\"_type\":\"block\",\"children\":[{\"_key\":\"969004792e41\",\"_type\":\"span\",\"marks\":[],\"text\":\"Crime prevention used to be reactive—something bad happened, and then you tried to piece together what went wrong. Flock Safety flipped that model on its head. Instead of solving crimes after the fact, they built technology to stop them before they happened.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f8657a5b576d\",\"_type\":\"block\",\"children\":[{\"_key\":\"4609e61f1fc0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Their automatic license plate recognition (ALPR) cameras gave neighborhoods, businesses, and law enforcement real-time intelligence. No more grainy security footage or endless dead ends—just clear, actionable data that helped solve and deter crime. It wasn’t just about catching criminals; it was about creating safer communities.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9331dd2f585a\",\"_type\":\"block\",\"children\":[{\"_key\":\"b65ec8432011\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because safety isn’t a privilege—it’s a necessity. Flock built a system that works quietly in the background, making entire cities more secure without the inefficiencies of outdated surveillance. It’s the kind of technology that, once adopted, becomes impossible to live without.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"f5da4255c51b\",\"_ref\":\"6a685aac-9172-4ca9-9eb4-910d2786bd03\",\"_type\":\"reference\"}],\"foundedYear\":2017,\"hq\":\"Atlanta, GA\",\"investmentRound\":\"Series E\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-7191f963e0d48c5836a7de45d6742c4ed970abfa-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Flock Safety\",\"subtitle\":\"Enhancing neighborhood safety with image recognition\",\"url\":\"https://www.flocksafety.com\"},{\"_createdAt\":\"2025-02-19T02:27:43Z\",\"_id\":\"925cd8dc-fd68-4340-9bd5-1fdd9e4b56a3\",\"_rev\":\"1gjDXMmy1t5S4ZgXupsmFt\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T02:33:48Z\",\"description\":[{\"_key\":\"43d7088fa00b\",\"_type\":\"block\",\"children\":[{\"_key\":\"e8b1526680e2\",\"_type\":\"span\",\"marks\":[],\"text\":\"H Bar C isn’t just a heritage brand—it’s an icon with the potential to redefine Western fashion. Founded in 1897, it has dressed everyone from rodeo champions to rock stars, proving that great craftsmanship never fades. Investing wasn’t about nostalgia; it was about backing a brand with deep roots and modern relevance, ready to capture a new generation of fans.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"29092443f83d\",\"_type\":\"block\",\"children\":[{\"_key\":\"df2c29e3eed2\",\"_type\":\"span\",\"marks\":[],\"text\":\"The team has masterfully revived H Bar C, balancing tradition with innovation. Their product quality is exceptional, and they’ve tapped into an underserved yet passionate market. By combining direct-to-consumer growth with smart retail partnerships, they’re building something scalable, not just sentimental.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"47e1375b1ef8\",\"_type\":\"block\",\"children\":[{\"_key\":\"6c225867dab8\",\"_type\":\"span\",\"marks\":[],\"text\":\"Western style isn’t a niche—it’s a movement. Culture, music, and fashion are embracing it, and H Bar C is perfectly positioned to lead. This isn’t just a comeback; it’s a brand poised to shape the future.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"3ba502c39c28\",\"_ref\":\"a3436614-117b-4bb9-abd3-9fd7bb657960\",\"_type\":\"reference\"}],\"foundedYear\":1897,\"hq\":\"Nashville, TN\",\"investmentRound\":\"Growth\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-4b98cd42d869202c39cb8c9c0a9375021d540622-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"H Bar C\",\"subtitle\":\"Premium western apparel\",\"url\":\"https://hbarc.com/\"},{\"_createdAt\":\"2025-02-04T23:12:59Z\",\"_id\":\"7e7fe2b9-0ecd-4f42-9700-d66378c6ab04\",\"_rev\":\"1gjDXMmy1t5S4ZgXuptIFN\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:58:57Z\",\"description\":[{\"_key\":\"1fd53d60c630\",\"_type\":\"block\",\"children\":[{\"_key\":\"89b9a45b71b1\",\"_type\":\"span\",\"marks\":[],\"text\":\"Software development is bottlenecked by time—brilliant ideas get slowed down by the grind of coding, debugging, and iteration. What if AI could take over the heavy lifting? That’s the future Magic is building.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"de043b1ad467\",\"_type\":\"block\",\"children\":[{\"_key\":\"1fcb4ddb3203\",\"_type\":\"span\",\"marks\":[],\"text\":\"They’re creating AI agents that write, refactor, and optimize code alongside human engineers, making development exponentially faster. Instead of replacing developers, Magic amplifies them—turning ideas into working products with less friction, less waiting, and more creativity.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"130b6eb329ea\",\"_type\":\"block\",\"children\":[{\"_key\":\"bf585a5b959d\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because the best engineers don’t need more tools—they need more leverage. Magic isn’t just automating coding; they’re reshaping how software gets built. In a world where speed wins, they’re giving developers a superpower.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"68112de6519a\",\"_ref\":\"c2ba67b4-1dee-4b6c-8be2-32ca98d1966a\",\"_type\":\"reference\"},{\"_key\":\"7eb1a007f914\",\"_ref\":\"a3436614-117b-4bb9-abd3-9fd7bb657960\",\"_type\":\"reference\"}],\"foundedYear\":2022,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Growth\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-ba7f8481aedd5134a1ad6f1f70a5bcbf82e743f4-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Magic\",\"subtitle\":\"AI-driven development tools\",\"url\":\"https://magic.dev\"},{\"_createdAt\":\"2025-02-04T23:13:25Z\",\"_id\":\"26a7b0c0-c8c7-4834-803f-d855319b8e67\",\"_rev\":\"acbHj2fSluNtatz77zp799\",\"_type\":\"investment\",\"_updatedAt\":\"2025-03-25T21:28:25Z\",\"description\":[{\"_key\":\"e9c6dfe666c0\",\"_type\":\"block\",\"children\":[{\"_key\":\"691b79866791\",\"_type\":\"span\",\"marks\":[],\"text\":\"AI is only as powerful as the infrastructure behind it, yet training deep learning models has been slow, expensive, and inefficient. Nervana Cloud saw the problem early and built a system designed from the ground up for AI.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"fe03e102c0fd\",\"_type\":\"block\",\"children\":[{\"_key\":\"250a60db21df\",\"_type\":\"span\",\"marks\":[],\"text\":\"Instead of relying on legacy hardware, they optimized everything—custom chips, memory architecture, and distributed processing—to accelerate machine learning at a fraction of the cost. Faster training meant faster breakthroughs, pushing AI forward in ways traditional computing never could.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"612d70a07d4a\",\"_type\":\"block\",\"children\":[{\"_key\":\"5cbea11d6075\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because AI’s future depends on efficiency, not just raw power. Nervana Cloud wasn’t just making deep learning faster—they were redefining what was possible. Compute shouldn’t be the bottleneck to innovation, and they proved it didn’t have to be.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"f5b836808de9\",\"_ref\":\"41c0111c-cc22-408c-9137-5bfdce10d52d\",\"_type\":\"reference\"}],\"foundedYear\":2014,\"hq\":\"San Diego, CA\",\"investmentRound\":\"Acquired by Intel\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-a8dfd45072d2cde0767cfef73a641733f8966d0f-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Nervana Systems\",\"subtitle\":\"Custom deep learning software\",\"url\":\"https://en.wikipedia.org/wiki/Nervana_Systems\"},{\"_createdAt\":\"2025-02-04T21:14:00Z\",\"_id\":\"1bfd707a-f322-4401-8264-5cbf2f981ae5\",\"_rev\":\"qHhNQIW6XHipcCVopwSkux\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:35Z\",\"description\":[{\"_key\":\"296ab3876f47\",\"_type\":\"block\",\"children\":[{\"_key\":\"635d0fba0b66\",\"_type\":\"span\",\"marks\":[],\"text\":\"Most people saw mobile gaming as a distraction—Niantic saw it as a bridge between the digital and physical world. While everyone else was building games that kept people glued to their screens, they were creating technology that pushed people outside, into the real world.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"565001b97096\",\"_type\":\"block\",\"children\":[{\"_key\":\"afacf2ebbf2c\",\"_type\":\"span\",\"marks\":[],\"text\":\"Their early work with Ingress proved that augmented reality could be more than a gimmick. Then Pokémon GO happened, and everything changed. It wasn’t just a game—it was a cultural event that got millions of people exploring their cities, meeting strangers, and experiencing AR at scale for the first time.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"9f368192fb2d\",\"_type\":\"block\",\"children\":[{\"_key\":\"fd8180c4e3bb\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because Niantic wasn’t just building games; they were laying the foundation for the future of spatial computing. The real world is the next platform, and they were the first to prove how powerful that could be.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"416b8192cfe5\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2010,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Series D\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-5a5b813cae21bf1aeabf42e94186ba2e22413a49-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Niantic\",\"subtitle\":\"Leading AR with interactive gaming\",\"url\":\"https://www.nianticlabs.com\"},{\"_createdAt\":\"2025-02-19T03:06:46Z\",\"_id\":\"589675d1-88ac-485a-bfb5-dd3a401e501b\",\"_rev\":\"1gjDXMmy1t5S4ZgXupslXB\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:08:55Z\",\"description\":[{\"_key\":\"3edd0360d4ca\",\"_type\":\"block\",\"children\":[{\"_key\":\"0df36f5d033d\",\"_type\":\"span\",\"marks\":[],\"text\":\"In today's digital age, the demand for secure and efficient online services has never been higher. Notarize addresses this need by offering a seamless platform for online notarization, allowing individuals and businesses to notarize documents from anywhere at any time. This innovation not only modernizes a traditionally cumbersome process but also expands access to essential services, aligning perfectly with my investment philosophy of supporting technologies that enhance accessibility and convenience.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d09941d0d315\",\"_type\":\"block\",\"children\":[{\"_key\":\"89db5bbf3275\",\"_type\":\"span\",\"marks\":[],\"text\":\"The team's execution has been impressive. Since its inception in 2015, Notarize has secured $244 million in funding over eight rounds, reflecting strong investor confidence. Their strategic partnerships and compliance with legal standards across all 50 states demonstrate a deep understanding of both the market and regulatory landscape. This solid foundation positions Notarize as a leader in the digital transformation of legal services.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"18d68d74bc31\",\"_type\":\"block\",\"children\":[{\"_key\":\"64eede3c6634\",\"_type\":\"span\",\"marks\":[],\"text\":\"Investing in Notarize is a commitment to the future of digital legal solutions. The company's ability to adapt and thrive in a rapidly evolving environment, coupled with a clear vision for growth, makes it a compelling addition to any forward-thinking investment portfolio. I am confident that Notarize will continue to set the standard for online notarization and beyond.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"14a252255ec4\",\"_ref\":\"88ae133c-158f-4d18-8482-f827c25a7bdc\",\"_type\":\"reference\"}],\"foundedYear\":2023,\"hq\":\"Boston, MA\",\"investmentRound\":\"Series D\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-9478b351c6309875d738cc2e2ede9589d1c92d7c-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Notarize\",\"subtitle\":\"Online legal document notarization platform\",\"url\":\"https://www.notarize.com/\"},{\"_createdAt\":\"2025-02-19T03:38:31Z\",\"_id\":\"20c4d36f-effb-49df-b3f0-0973545e43e2\",\"_rev\":\"qHhNQIW6XHipcCVopwSVJU\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:39:53Z\",\"description\":[{\"_key\":\"fe67931e0782\",\"_type\":\"block\",\"children\":[{\"_key\":\"06c33adc3b30\",\"_type\":\"span\",\"marks\":[],\"text\":\"Accounting teams are stuck with outdated tools, wasting time on manual reconciliations and financial closes. Numeric changes that by automating the close process with AI, improving accuracy and freeing finance teams to focus on strategy.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"e95dbd1d3e76\",\"_type\":\"block\",\"children\":[{\"_key\":\"cf9ac9a7801e\",\"_type\":\"span\",\"marks\":[],\"text\":\"Founded in 2020, Numeric has quickly gained traction, securing a $28M Series A from top investors like Menlo Ventures and IVP. Its platform is already used by hundreds of accounting teams, proving strong product-market fit.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"df5ecb4f0e98\",\"_type\":\"block\",\"children\":[{\"_key\":\"c5ffb028bc67\",\"_type\":\"span\",\"marks\":[],\"text\":\"Numeric is redefining how finance teams operate. By making accounting faster and smarter, it’s poised to become a core part of modern financial operations.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"0b7fde4d8bf2\",\"_ref\":\"3da61aea-b6be-4091-906d-65fe45a3e42c\",\"_type\":\"reference\"}],\"foundedYear\":2018,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Series A\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-4be5cacff5196de610983b926c125c67eb4e44ab-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Numeric\",\"subtitle\":\"AI-powered accounting automation platform\"},{\"_createdAt\":\"2025-02-19T02:35:49Z\",\"_id\":\"18a7e80c-3969-4114-9af4-2a944b9cd971\",\"_rev\":\"qHhNQIW6XHipcCVopwUbWx\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:53:16Z\",\"description\":[{\"_key\":\"8c719fdedaf1\",\"_type\":\"block\",\"children\":[{\"_key\":\"de53b16f2cb5\",\"_type\":\"span\",\"marks\":[],\"text\":\"In the late 1990s, online payments were slow, insecure, and fragmented. PayPal solved this with a seamless, scalable solution that quickly gained traction, especially through eBay. Its network effects created a self-reinforcing cycle—more users attracted more merchants, solidifying its dominance.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cded4641c0bc\",\"_type\":\"block\",\"children\":[{\"_key\":\"ede49d1a8ed4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Unlike traditional banks, PayPal leveraged technology to reduce friction, scale rapidly, and expand into broader financial services. With low customer acquisition costs and high transaction volume, it was positioned to become the backbone of digital commerce. Investing early meant betting on the rise of fintech and the future of online payments.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"d1b5fc4dab1f\",\"_ref\":\"a0ced8b8-14d6-40eb-b0b4-8664f83e15bd\",\"_type\":\"reference\"}],\"foundedYear\":1998,\"hq\":\"San Jose, CA\",\"investmentRound\":\"Acquired by Ebay\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-dc073ff02880452503a33d6c89263c0a2d21d47e-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"PayPal\",\"subtitle\":\"Fast and secure online payments worldwide\",\"url\":\"https://www.paypal.com/\"},{\"_createdAt\":\"2025-02-04T21:13:00Z\",\"_id\":\"78663d54-381e-4808-bebd-0235aadb61b5\",\"_rev\":\"qHhNQIW6XHipcCVopwUjMN\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:54:54Z\",\"description\":[{\"_key\":\"a937ef7f00a8\",\"_type\":\"block\",\"children\":[{\"_key\":\"53269f792ecf\",\"_type\":\"span\",\"marks\":[],\"text\":\"Convenience isn’t a luxury—it’s a shift in how people interact with the world. Before Postmates, delivery was rigid, slow, and limited to pizza and takeout. But what if you could get anything, from any store, delivered on demand? That was the question Postmates answered.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0eebb64dac8d\",\"_type\":\"block\",\"children\":[{\"_key\":\"5ccffc32099e\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested in Postmates because it wasn’t just another delivery service—it was an entirely new infrastructure for urban logistics. It turned local businesses into fulfillment centers, giving them the ability to compete with giants like Amazon. Suddenly, a neighborhood bakery or a boutique shop could have the same delivery power as a massive e-commerce brand.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"389821e7f59b\",\"_type\":\"block\",\"children\":[{\"_key\":\"d73e0168e76c\",\"_type\":\"span\",\"marks\":[],\"text\":\"The real magic of Postmates was in its flexibility. It didn’t rely on a warehouse model or centralized distribution. Instead, it built a decentralized network where couriers, stores, and customers were dynamically connected in real time. That kind of efficiency doesn’t just make delivery better—it changes how cities function.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"87016a212803\",\"_type\":\"block\",\"children\":[{\"_key\":\"7aa34c596ca6\",\"_type\":\"span\",\"marks\":[],\"text\":\"Of course, the early days weren’t easy. People doubted whether consumers would pay for on-demand delivery, whether local businesses would adapt, whether the gig economy could sustain itself. But the shift was inevitable. Once people got used to the idea that anything they wanted could arrive in under an hour, there was no going back.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a8daa1ea748f\",\"_type\":\"block\",\"children\":[{\"_key\":\"74e3826bf269\",\"_type\":\"span\",\"marks\":[],\"text\":\"Postmates wasn’t just about delivery—it was about redefining access. It gave people time back. It leveled the playing field for small businesses. And it proved that convenience, when done right, becomes something you can’t live without. That’s why I backed it.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"acae467f2d6c\",\"_ref\":\"a0ced8b8-14d6-40eb-b0b4-8664f83e15bd\",\"_type\":\"reference\"}],\"foundedYear\":2011,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Acquired by Uber\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-d0c8dc6cb951d28477756086256dab536930185b-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Postmates\",\"subtitle\":\"Redefined delivery with on-demand tech\",\"url\":\"https://www.postmates.com\"},{\"_createdAt\":\"2025-02-04T23:16:13Z\",\"_id\":\"57a4703e-e057-4949-b901-8f1ae843fac1\",\"_rev\":\"qHhNQIW6XHipcCVopwV2Ux\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:57:37Z\",\"description\":[{\"_key\":\"704792666e85\",\"_type\":\"block\",\"children\":[{\"_key\":\"cfa095f04443\",\"_type\":\"span\",\"marks\":[],\"text\":\"Search was broken. You had to think like a machine—type the right keywords, guess what the algorithm wanted. But what if a search engine actually understood you? That’s what Powerset was building.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"660adf4d4eb5\",\"_type\":\"block\",\"children\":[{\"_key\":\"f0955260c4e2\",\"_type\":\"span\",\"marks\":[],\"text\":\"They weren’t just improving search; they were reinventing it. Their natural language processing could interpret full questions, grasp meaning, and return answers instead of links. It was the first real attempt at making search feel human.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d322bb06fe15\",\"_type\":\"block\",\"children\":[{\"_key\":\"f0dc425f945e\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because this was the inevitable future of information retrieval. People don’t think in keywords—they think in ideas. Powerset was ahead of its time, but the technology they built laid the foundation for the AI-driven search we take for granted today.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"c74cd02b6b71\",\"_ref\":\"a0ced8b8-14d6-40eb-b0b4-8664f83e15bd\",\"_type\":\"reference\"}],\"foundedYear\":2005,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Acquired by Microsoft\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-e90e29a7cd310aaf81dcbb061ac7582f69bc1456-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Powerset\",\"subtitle\":\"Natural language search engine\",\"url\":\"https://en.wikipedia.org/wiki/Powerset_(company)\"},{\"_createdAt\":\"2025-03-25T21:28:48Z\",\"_id\":\"91539d21-2cb8-4e19-8e08-7fe6dd5e9d72\",\"_rev\":\"rxTWt7rai7V5fzZh48fD0v\",\"_type\":\"investment\",\"_updatedAt\":\"2025-03-25T21:34:08Z\",\"description\":[{\"_key\":\"6a172d9b452c\",\"_type\":\"block\",\"children\":[{\"_key\":\"993ecaf81047\",\"_type\":\"span\",\"marks\":[],\"text\":\"Prompt.io™ is a robust texting platform for political organizations, advocacy groups, nonprofits and commercial uses. We service customers via fully registered 10DLC, toll free, and short code. We pride ourselves in creating true partnership with our customers – we don't just deliver texts, we deliver results.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"8326b872b9c9\",\"_ref\":\"41c0111c-cc22-408c-9137-5bfdce10d52d\",\"_type\":\"reference\"},{\"_key\":\"a042b7dfb991\",\"_ref\":\"56d88b4c-ef1d-4fc0-b17c-6c0449bde32d\",\"_type\":\"reference\"}],\"foundedYear\":2014,\"hq\":\"Seattle\",\"investmentRound\":\"Seed\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-f5c7d47fbb8bb4fe129674a128cd1d86010dfd53-500x94-png\",\"_type\":\"reference\"}},\"name\":\"Prompt.io\",\"subtitle\":\"influence engine that turns conversations into action...\"},{\"_createdAt\":\"2025-02-04T23:14:01Z\",\"_id\":\"9994499a-6eb5-4824-b26f-51da6365bc5a\",\"_rev\":\"1WHDkljrVtmQ1JyfE3nRSo\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-07T18:23:23Z\",\"description\":[{\"_key\":\"06591b4a5730\",\"_type\":\"block\",\"children\":[{\"_key\":\"0f66e1a98987\",\"_type\":\"span\",\"marks\":[],\"text\":\"Water scarcity is one of the most pressing challenges of our time. As populations grow and climate patterns shift, traditional water sources are becoming unreliable. Rainmaker saw an opportunity to change that—not by extracting more, but by creating it.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0491702304fa\",\"_type\":\"block\",\"children\":[{\"_key\":\"23a73beed4e2\",\"_type\":\"span\",\"marks\":[],\"text\":\"Their precipitation enhancement technology accelerates rainfall in a way that’s scalable, immediate, and environmentally sustainable. Instead of waiting for nature to provide, they built a system that ensures communities, farms, and ecosystems get the water they need, when they need it.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"25087bab23bb\",\"_type\":\"block\",\"children\":[{\"_key\":\"defc8a963dfb\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because the world doesn’t just need conservation—it needs innovation. Rainmaker isn’t fighting over existing water resources; they’re expanding what’s possible. In a future where access to water defines everything, they’re making abundance a reality.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"fdbc0019072f\",\"_ref\":\"3da61aea-b6be-4091-906d-65fe45a3e42c\",\"_type\":\"reference\"}],\"foundedYear\":2023,\"hq\":\"El Segundo, CA\",\"investmentRound\":\"Seed\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-8e1f81bbc077e2772c715cba5c1ffec9d3ccf4ae-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Rainmaker\",\"subtitle\":\"Water for farms, watersheds, and ecosystems\",\"url\":\"https://www.rainmaker.com\"},{\"_createdAt\":\"2025-02-04T20:56:29Z\",\"_id\":\"98b0b704-d160-4e12-bdd3-3f161ec53381\",\"_rev\":\"1gjDXMmy1t5S4ZgXupslw9\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:44:54Z\",\"description\":[{\"_key\":\"c7d18ce9f62c\",\"_type\":\"block\",\"children\":[{\"_key\":\"77bd3eb3b482\",\"_type\":\"span\",\"marks\":[],\"text\":\"I bet on people who refuse to accept the word \\\"impossible.\\\" When I first looked at SpaceX, everyone told me what couldn’t be done—rockets couldn’t be made reusable, launches couldn’t be affordable, private companies couldn’t compete with NASA and the defense industry. But Elon Musk didn’t care about what couldn’t be done. He had already decided that it would be done.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b2efe80b05c5\",\"_type\":\"block\",\"children\":[{\"_key\":\"b04359532e98\",\"_type\":\"span\",\"marks\":[],\"text\":\"Most people see space as a playground for governments and science fiction. Elon saw it as an industry—one that was stagnant, inefficient, and overdue for disruption. The simple but radical insight was that reusability would change everything. When you stop throwing away the rocket every time you launch, you lower the cost to orbit by orders of magnitude. That’s not just a cost-saving measure; it’s a paradigm shift. It’s what makes interplanetary life possible.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"09d5a013a349\",\"_type\":\"block\",\"children\":[{\"_key\":\"8d3ef181d3af\",\"_type\":\"span\",\"marks\":[],\"text\":\"SpaceX wasn’t a safe bet, but that’s never been my kind of investment. I don’t invest in things that maintain the status quo—I invest in the people who break it. There was no guarantee SpaceX would work, but if it did, it would reshape everything: satellite networks, space manufacturing, planetary exploration, even energy production. The way I saw it, the real risk wasn’t investing—it was sitting on the sidelines and watching the future pass by.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"cb372edc9f49\",\"_type\":\"block\",\"children\":[{\"_key\":\"2d00aaab5f77\",\"_type\":\"span\",\"marks\":[],\"text\":\"I backed SpaceX because the world needs more people willing to take on the impossible. And sometimes, those are the only bets worth making.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"40e379f41a97\",\"_ref\":\"7d0a19cf-da07-482e-b5a1-8065ecfa510a\",\"_type\":\"reference\"}],\"foundedYear\":2002,\"hq\":\"Hawthorne, CA\",\"investmentRound\":\"Private\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-94f8729922a97096e755094d63bf78d679a6e719-129x128-svg\",\"_type\":\"reference\"}},\"name\":\"SpaceX\",\"subtitle\":\"Revolutionizing space with reusable rockets\",\"url\":\"https://spacex.com\"},{\"_createdAt\":\"2025-02-19T03:40:18Z\",\"_id\":\"3aa61130-3691-4879-8415-c503c530a8d3\",\"_rev\":\"0eNF9355C3KLm4kQrGEu1S\",\"_type\":\"investment\",\"_updatedAt\":\"2025-03-01T05:17:50Z\",\"folder\":[{\"_key\":\"a89416f9c714\",\"_ref\":\"aca6ba40-9adb-45ac-991f-4ba713044dc1\",\"_type\":\"reference\"}],\"foundedYear\":101010101,\"hq\":\"Earth\",\"investmentRound\":\"Growth\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-2811a1c91fe47ce639e3515c9c332283a6e3bca7-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Stealth\",\"subtitle\":\"Announcing soon\"},{\"_createdAt\":\"2025-02-04T21:15:11Z\",\"_id\":\"9653f155-c269-4292-9397-f7783f861a46\",\"_rev\":\"itvkhwxEA2FOFySb8fhWA7\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:02Z\",\"description\":[{\"_key\":\"ceeada6ef8cc\",\"_type\":\"block\",\"children\":[{\"_key\":\"9146ce426db4\",\"_type\":\"span\",\"marks\":[],\"text\":\"Finding a skilled professional used to mean asking around, hoping for a referral, or gambling on a random listing. It was inefficient, outdated, and left both customers and service providers frustrated. Thumbtack changed that.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f3451ee65493\",\"_type\":\"block\",\"children\":[{\"_key\":\"5ce2dcec5f67\",\"_type\":\"span\",\"marks\":[],\"text\":\"They built a marketplace where local pros and customers could connect seamlessly. Instead of cold-calling or chasing leads, businesses could focus on their work while the platform handled the matchmaking. For consumers, hiring a plumber, photographer, or tutor became as easy as ordering a ride.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"01041f4c224d\",\"_type\":\"block\",\"children\":[{\"_key\":\"38f3f343749d\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because technology should empower small businesses, not replace them. Thumbtack wasn’t automating work—it was making it easier to find. By turning fragmented local services into a scalable digital marketplace, they unlocked economic opportunity for millions.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"fcbe89082f8a\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2008,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Series H\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-d4cd12949becd00e0195c825d45af66de9547488-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Thumbtack\",\"subtitle\":\"Connecting customers with local professionals\",\"url\":\"https://www.thumbtack.com\"},{\"_createdAt\":\"2025-02-04T22:34:26Z\",\"_id\":\"698736ca-7e13-4765-a2e3-247b511b2425\",\"_rev\":\"qHhNQIW6XHipcCVopwUrcl\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:56:01Z\",\"description\":[{\"_key\":\"75be6c0f4066\",\"_type\":\"block\",\"children\":[{\"_key\":\"ec54bdb47afc\",\"_type\":\"span\",\"marks\":[],\"text\":\"AI is only as powerful as the infrastructure behind it, but training and running large models has been locked behind closed doors—expensive, inefficient, and dominated by a few massive players. Together.ai is changing that.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"55ecffa681f5\",\"_type\":\"block\",\"children\":[{\"_key\":\"57031ee16782\",\"_type\":\"span\",\"marks\":[],\"text\":\"They’re building an open, collaborative ecosystem where anyone can train, fine-tune, and run AI models at scale. By optimizing compute and leveraging decentralized resources, they’re making AI more accessible and cost-effective for startups, researchers, and enterprises alike.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a72ef0f446df\",\"_type\":\"block\",\"children\":[{\"_key\":\"64ca178d2a0a\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because the future of AI shouldn’t be controlled by a handful of companies. Together.ai isn’t just building infrastructure—they’re democratizing intelligence, ensuring that innovation stays open, fast, and available to those pushing the boundaries of what’s possible.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"3d23434ac3ff\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"},{\"_key\":\"d109c6e10682\",\"_ref\":\"aca6ba40-9adb-45ac-991f-4ba713044dc1\",\"_type\":\"reference\"}],\"foundedYear\":2022,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Series A\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-f118c23949a05fa4561f6a2a882f8c16f8dff478-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Together.ai\",\"subtitle\":\"Train, fine-tune, and run inference on AI models\",\"url\":\"https://www.together.ai/\"},{\"_createdAt\":\"2025-02-04T23:15:42Z\",\"_id\":\"4a688142-dcaa-49c7-a9d4-27f50cd30eab\",\"_rev\":\"qHhNQIW6XHipcCVopwSZzO\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:44:51Z\",\"description\":[{\"_key\":\"06a065e1cad5\",\"_type\":\"block\",\"children\":[{\"_key\":\"de44a3a5b578\",\"_type\":\"span\",\"marks\":[],\"text\":\"Social media changed how information spread, but no one really understood it. There was no way to measure influence, track conversations in real time, or make sense of the noise. Topsy solved that.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"311af4b9c27d\",\"_type\":\"block\",\"children\":[{\"_key\":\"68edd116d0ce\",\"_type\":\"span\",\"marks\":[],\"text\":\"They weren’t just indexing tweets—they were mapping the flow of ideas. They built the first real-time search engine for social media, showing who started trends, how topics evolved, and what actually mattered. That kind of insight was invaluable, not just for brands and media but for understanding culture itself.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5a5d4e9b07e1\",\"_type\":\"block\",\"children\":[{\"_key\":\"f0e8a418ba3f\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because I saw the future in data, not opinions. Topsy turned raw conversation into intelligence. It was early proof that social wasn’t just entertainment—it was an information network with real power. They saw it before most did.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"bbec68a2b48f\",\"_ref\":\"a0ced8b8-14d6-40eb-b0b4-8664f83e15bd\",\"_type\":\"reference\"}],\"foundedYear\":2007,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Acquired by Apple\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-1ed4a351854d426d19746d4a4dcf84be96dbc93a-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Topsy\",\"subtitle\":\"Social media and search analytics platform\",\"url\":\"https://en.wikipedia.org/wiki/Topsy_Labs\"},{\"_createdAt\":\"2025-02-04T23:15:07Z\",\"_id\":\"14821cbe-4074-4965-b74f-c25a828d4ee8\",\"_rev\":\"0m4SgAPWuHtVIqFVW56paa\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-07T18:24:20Z\",\"description\":[{\"_key\":\"ddbfbc8b23f6\",\"_type\":\"block\",\"children\":[{\"_key\":\"1c2b9b2d6537\",\"_type\":\"span\",\"marks\":[],\"text\":\"Healthcare spending in the U.S. is broken—not because people don’t have funds, but because they can’t use them where they should. HSAs and FSAs were designed to make health and wellness more affordable, yet most consumers don’t realize just how flexible these accounts can be. TrueMed saw the gap and built the solution.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5de6f6b958e9\",\"_type\":\"block\",\"children\":[{\"_key\":\"115723457513\",\"_type\":\"span\",\"marks\":[],\"text\":\"Their platform unlocks HSA/FSA dollars for everyday health expenses—nutrition, fitness, preventative care—giving consumers the power to spend their own money on what actually keeps them healthy. Instead of limiting access to a narrow set of outdated categories, TrueMed expands the definition of wellness to fit modern needs.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"6ad90fe1f147\",\"_type\":\"block\",\"children\":[{\"_key\":\"8dbfb488916e\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because health isn’t just about treatment—it’s about prevention. TrueMed isn’t just making payments easier; they’re shifting how we think about healthcare spending. In a world where wellness is everything, they’re ensuring financial tools support it, not restrict it.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"bbe617eaa2ea\",\"_ref\":\"3da61aea-b6be-4091-906d-65fe45a3e42c\",\"_type\":\"reference\"}],\"foundedYear\":2022,\"hq\":\"Austin, TX\",\"investmentRound\":\"Seed\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-d5f4398775bf4576edb0a2616e925b09b8a23de3-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"TrueMed\",\"subtitle\":\"HSA/FSA health spending marketplace\",\"url\":\"https://www.truemed.com\"},{\"_createdAt\":\"2025-02-04T22:35:03Z\",\"_id\":\"0a957172-728f-4a76-af53-f2e0de921c3f\",\"_rev\":\"itvkhwxEA2FOFySb8fhg3r\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:45:27Z\",\"description\":[{\"_key\":\"a1ec6369284f\",\"_type\":\"block\",\"children\":[{\"_key\":\"014e6887f5d0\",\"_type\":\"span\",\"marks\":[],\"text\":\"Building advanced AI systems has always been complex and resource-intensive. Companies need cutting-edge infrastructure to train, deploy, and scale AI, but the right tools and expertise have been fragmented—until Turing saw the opportunity to change that.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d7e36ec7071b\",\"_type\":\"block\",\"children\":[{\"_key\":\"b80e1f12c38a\",\"_type\":\"span\",\"marks\":[],\"text\":\"They built an AGI infrastructure platform that accelerates innovation by providing enterprises with the tools to design, train, and deploy advanced AI systems. From foundation model training to generative AI applications, Turing is creating the backbone for the next era of artificial intelligence. No more bottlenecks—just scalable, high-performance AI infrastructure optimized for speed and efficiency.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f800f58dbe66\",\"_type\":\"block\",\"children\":[{\"_key\":\"cdff0f425a58\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because the future of AI requires more than just powerful models—it needs the right infrastructure to bring them to life. Turing isn’t just enabling AI development; they’re building the foundation for the next generation of intelligence.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"0bcc9b0eda3a\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2018,\"hq\":\"Palo Alto, CA\",\"investmentRound\":\"Private\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-82955c49c6ab9b46e4c1e218b543ecfdb97ea1be-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Turing\",\"subtitle\":\"Build and deploy generative AI products\",\"url\":\"https://www.turing.com\"},{\"_createdAt\":\"2025-02-04T20:59:16Z\",\"_id\":\"9f53868e-3885-4330-913e-4afea95794f6\",\"_rev\":\"itvkhwxEA2FOFySb8fiV37\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:49:24Z\",\"description\":[{\"_key\":\"3447de3626a9\",\"_type\":\"block\",\"children\":[{\"_key\":\"3cb7af76041a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Most people don’t realize how broken something is until someone comes along and fixes it. Before Uber, getting a ride was a nightmare—calling a cab meant hoping one would show up, dealing with rude dispatchers, and fumbling for cash. It was slow, inefficient, and designed for a world that no longer existed. When I met Travis, it was clear he didn’t just want to build a company—he wanted to dismantle an outdated system and replace it with something 10x better.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"87e077c60851\",\"_type\":\"block\",\"children\":[{\"_key\":\"246124a7cf13\",\"_type\":\"span\",\"marks\":[],\"text\":\"Uber wasn’t just about ridesharing. It was about using technology to create efficiency where none existed. It turned a chaotic, unreliable process into something seamless: tap a button, get a ride. Simple. But under the hood, it was a logistics engine, matching supply and demand in real time, dynamically pricing based on need, and optimizing transportation at a scale no city had ever seen before.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d9a78d3c540c\",\"_type\":\"block\",\"children\":[{\"_key\":\"c13568b20e64\",\"_type\":\"span\",\"marks\":[],\"text\":\"People forget how controversial Uber was in the early days. Cities fought it, taxi unions protested, regulators tried to shut it down. But Uber didn’t ask for permission—it just worked. And once people experienced how much better it was, there was no going back. That’s when I knew it wasn’t just a company; it was a movement.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"8ee5946f97ad\",\"_type\":\"block\",\"children\":[{\"_key\":\"02f6189187c6\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested in Uber because it had all the ingredients of a true disruptor—massive inefficiencies to fix, an unstoppable founder, and a product so good that once you tried it, you’d never use anything else. That’s the kind of company that doesn’t just win. It changes the way the world works.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"6f522724bc2f\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2009,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Public\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-7706d5d22b839089ed41358b34b5d4d0d3a2681e-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Uber\",\"subtitle\":\"Transforming urban mobility with ridesharing\",\"url\":\"https://www.uber.com\"},{\"_createdAt\":\"2025-02-04T21:18:18Z\",\"_id\":\"58575c80-424e-4e24-bccd-91299d725d59\",\"_rev\":\"qHhNQIW6XHipcCVopwV2lo\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:57:39Z\",\"description\":[{\"_key\":\"02183d0f3b69\",\"_type\":\"block\",\"children\":[{\"_key\":\"bedc7f23ea80\",\"_type\":\"span\",\"marks\":[],\"text\":\"Traditional lending models are broken. Banks rely on outdated credit scores that don’t tell the full story, leaving millions of creditworthy people locked out of the system. Upstart saw a better way.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"d5e5b042dec2\",\"_type\":\"block\",\"children\":[{\"_key\":\"e23998009740\",\"_type\":\"span\",\"marks\":[],\"text\":\"They built AI-powered underwriting that looks beyond a FICO score, factoring in education, employment history, and real earning potential. The result? More accurate risk assessment, better loan approvals, and access to credit for people who would’ve been ignored by traditional banks.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"dbcbc7d908af\",\"_type\":\"block\",\"children\":[{\"_key\":\"755214c14db2\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because financial access shouldn’t be limited by outdated metrics. Upstart wasn’t just making loans—they were making lending smarter, fairer, and more aligned with how people actually build their financial lives. That’s the future of credit.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"880d10b5f0a7\",\"_ref\":\"21011fd6-77b9-4b54-a6e3-3a779925e36c\",\"_type\":\"reference\"}],\"foundedYear\":2012,\"hq\":\"San Mateo, CA\",\"investmentRound\":\"Public\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-623248f3130248df4a6f988ec2239dc901922e9b-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Upstart\",\"subtitle\":\"AI-powered lending platform\",\"url\":\"https://www.upstart.com\"},{\"_createdAt\":\"2025-02-04T23:14:36Z\",\"_id\":\"16b1a9cc-38a3-4bca-8e5f-d5eda3f87a3f\",\"_rev\":\"1WHDkljrVtmQ1JyfE3nU7T\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-07T18:23:50Z\",\"description\":[{\"_key\":\"0cc87e2a98ca\",\"_type\":\"block\",\"children\":[{\"_key\":\"07061e6204ce\",\"_type\":\"span\",\"marks\":[],\"text\":\"Government contracting is a maze of bureaucracy, dense proposals, and slow-moving processes that kill innovation before it even starts. Winning a federal contract isn’t just about having the best solution—it’s about navigating an outdated, inefficient system. Vultron is changing that.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"da4aed13c7eb\",\"_type\":\"block\",\"children\":[{\"_key\":\"0adbc5c8747d\",\"_type\":\"span\",\"marks\":[],\"text\":\"By using AI to streamline federal proposal development, they’re turning a slow, manual grind into a precise, data-driven process. Their platform analyzes requirements, optimizes submissions, and helps companies win contracts faster. Instead of letting paperwork dictate progress, they’re making government procurement work at startup speed.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5436cbb303c5\",\"_type\":\"block\",\"children\":[{\"_key\":\"4aeebe7e3580\",\"_type\":\"span\",\"marks\":[],\"text\":\"I invested because the best technologies shouldn’t get buried in red tape. Vultron isn’t just helping companies win contracts—they’re ensuring the most advanced solutions make it to the front lines. In an industry where speed and clarity matter, they’re giving innovators the edge they need.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"91ee3c9b2937\",\"_ref\":\"3da61aea-b6be-4091-906d-65fe45a3e42c\",\"_type\":\"reference\"}],\"foundedYear\":2023,\"hq\":\"San Francisco, CA\",\"investmentRound\":\"Seed\",\"logo\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-8fcf1ef392e15a9c67b2d4795707594148794ac8-128x128-svg\",\"_type\":\"reference\"}},\"name\":\"Vultron\",\"subtitle\":\"AI for federal proposal development\",\"url\":\"https://www.vultron.ai\"},{\"_createdAt\":\"2025-02-19T02:57:09Z\",\"_id\":\"070ef234-a762-4868-b240-9212726f09f4\",\"_rev\":\"itvkhwxEA2FOFySb8fhQGn\",\"_type\":\"investment\",\"_updatedAt\":\"2025-02-19T03:00:16Z\",\"description\":[{\"_key\":\"f487b7e7dee0\",\"_type\":\"block\",\"children\":[{\"_key\":\"1c609fe808ed\",\"_type\":\"span\",\"marks\":[],\"text\":\"Investing in ZenBusiness aligns with a philosophy of supporting ventures that democratize entrepreneurship and empower individuals to achieve financial independence. By simplifying the complexities of business formation and compliance, ZenBusiness enables aspiring entrepreneurs to focus on innovation and growth, fostering a more inclusive economy.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f7f0329209d3\",\"_type\":\"block\",\"children\":[{\"_key\":\"112421a3d9bb\",\"_type\":\"span\",\"marks\":[],\"text\":\"The company's impressive growth trajectory and substantial Series C funding underscore its potential to become a market leader in the small business services sector. This momentum reflects a strong product-market fit and a scalable business model poised for long-term success.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"301c4389993a\",\"_type\":\"block\",\"children\":[{\"_key\":\"3a2c37f6b8fb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Backing ZenBusiness means investing in a mission-driven company that not only offers a compelling financial opportunity but also contributes positively to society by lowering barriers to entrepreneurship and supporting the dreams of small business owners nationwide.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"folder\":[{\"_key\":\"1dd64743de5f\",\"_ref\":\"6
